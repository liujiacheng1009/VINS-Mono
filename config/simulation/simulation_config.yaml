%YAML:1.0

#common parameters
imu_topic: "/data_generator/imu"
image_topic: "/data_generator/image"
output_path: "/tmp/vins_multi_output/"
# image size from cam_chain when loaded; defaults below are fallback only
image_height: 480
image_width: 752

# IMU–camera extrinsics: cam_chain-imucam.yaml (cam0 T_cam_imu); cam1+ from cam_chain.yaml T_cn_cnm1
estimate_extrinsic: 0   # 0 fix, 1 optimize around prior, 2 calibrate (identity init)

# sliding window and camera layout
window_size: 10
# num_of_cam: 2             # active camera slots in estimator
# camera_ids: [0, 1]        # physical cam index per slot: [0], [0,1], or [1] for mono-right only
num_of_cam: 1 
camera_ids: [0]   
cam_chain_file: "cam_chain.yaml"
cam_chain_imu_file: "cam_chain-imucam.yaml"
max_feature_count: 1000       # per camera; total pool = value * num_of_cam

#optimization parameters
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

#imu parameters
acc_n: 0.1
gyr_n: 0.05
acc_w: 0.002
gyr_w: 4.0e-5
g_norm: 9.81007

#unsynchronization parameters
estimate_td: 0
td: 0.0

#rolling shutter parameters
rolling_shutter: 0
rolling_shutter_tr: 0

#visualization parameters
save_image: 0
visualize_imu_forward: 0
visualize_camera_size: 0.4
